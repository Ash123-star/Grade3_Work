name: workpanel-backend
services:
  data:
    image: collaboration-data-runtime:local
    build:
      context: ..
      dockerfile: runtime/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: workpanel
      POSTGRES_USER: workpanel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55435}:5432"
      - "127.0.0.1:${REDIS_PORT:-56382}:6379"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-57688}:7687"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - redis-data:/data
      - neo4j-data:/var/lib/neo4j/data
      - ../redis:/opt/redis:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/runtime/health.sh"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 40s
  api:
    image: workpanel-backend:${BACKEND_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      data:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://data:5432/workpanel
      DB_USER: workpanel
      DB_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      REDIS_HOST: data
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
      ADMIN_ACCOUNT: ${ADMIN_ACCOUNT:?请设置 ADMIN_ACCOUNT}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD}
      ADMIN_PHONE: ${ADMIN_PHONE:?请设置 ADMIN_PHONE}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      AI_DAILY_TOKENS: ${AI_DAILY_TOKENS:-50000}
      AI_WORKBENCH_ENABLED: ${AI_WORKBENCH_ENABLED:-true}
      AI_WORK_EXECUTION_ENABLED: ${AI_WORK_EXECUTION_ENABLED:-false}
      AI_OCR_ENABLED: ${AI_OCR_ENABLED:-false}
      AI_OCR_URL: ${AI_OCR_URL:-}
      AI_PARSER_SANDBOX_REQUIRED: true
      SESSION_HOURS: ${SESSION_HOURS:-168}
      SCENARIO_DATA_ENABLED: ${SCENARIO_DATA_ENABLED:-false}
      SCENARIO_PASSWORD: ${SCENARIO_PASSWORD:-}
      SCENARIO_DATASET: ${SCENARIO_DATASET:-legacy}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      NEO4J_URI: bolt://data:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  gateway:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  caddy-data:
  caddy-config:
