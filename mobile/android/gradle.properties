org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

org.gradle.workers.max=2
org.gradle.parallel=false
# Reuse the Gradle JVM to avoid another Kotlin daemon heap on low-memory Windows.
kotlin.compiler.execution.strategy=in-process
