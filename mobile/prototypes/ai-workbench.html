<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>团团 AI 办事交互原型</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9eee9;color:#34483f;font:16px "Microsoft YaHei",sans-serif}main{width:min(100%,412px);height:100dvh;min-height:640px;margin:auto;background:#fffdf4;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;padding:24px 20px 16px;align-items:center}h1{font-size:24px;margin:0}h2{font-size:21px;margin:0 0 16px}p{line-height:1.65}button,select{font:inherit;min-height:48px;border:1px solid #c5d7cd;border-radius:16px;padding:10px 14px;background:#fff;color:inherit;cursor:pointer}.content{flex:1;overflow:auto;padding:12px 20px}.card{border:1px solid #d5e4db;border-radius:24px;padding:24px;background:#f1e7ff;margin:16px 0;box-shadow:0 3px 0 #d9e5dc}.card.success{background:#e2f2de}.primary{background:#d1edce;border-color:#8dbd8b;font-weight:bold;width:100%;margin-top:16px}.composer{display:flex;gap:8px;padding:16px;border-top:1px solid #dce8df}.composer input{font:inherit;width:0;flex:1;border:1px solid #d5e4db;border-radius:16px;padding:14px}.nav{display:flex;justify-content:space-around;background:#e5f1e6;padding:14px 8px 22px;border-radius:24px 24px 0 0;font-size:14px}.nav strong{color:#665186}.examples{display:flex;flex-wrap:wrap;gap:12px}details{margin-top:20px}label{display:block;padding:0 20px}select{width:100%}@media(prefers-reduced-motion:no-preference){.card{animation:enter .22s ease-out}@keyframes enter{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}</style>
<main><header><h1>AI地图</h1><button aria-label="办事设置">⚙</button></header><label><select id="state" aria-label="预览状态"><option value="empty">首页</option><option value="input">需要补充</option><option value="confirm">核对操作</option><option value="check">检查材料</option><option value="success">任务已创建</option><option value="partial">部分办妥</option><option value="failure">暂时无法处理</option><option value="denied">权限变化</option></select></label><section class="content" id="content" aria-live="polite"></section><form class="composer"><button type="button" aria-label="添加图片或文件">＋</button><input placeholder="说说要办什么…" aria-label="要办什么"><button>发送</button></form><nav class="nav"><span>导图</span><span>视图</span><span>日志</span><strong>AI地图</strong><span>我的</span></nav></main>
<script>const cards={empty:['把事情交给我','截图建任务 · 检查交付 · 找制度和模板',''],input:['这项任务什么时候交？','已找到负责人小李，补充截止日期后就能继续。','选择日期'],confirm:['给小李创建「交付成本表」','11月1日 17:00前提交成本明细。原始聊天截图仅你可见。','创建任务'],check:['数量需要核对','成本表第2行：明细合计与总价不一致，请核对后补充材料。','补充材料'],success:['任务已交给小李','任务已创建，可以到任务详情查看。','查看任务'],partial:['已创建2项，还有1项需要处理','成本表与交付清单已派发，第三项缺少负责人。','继续处理'],failure:['暂时没能处理，内容已保留','稍后可以继续办理。','重试'],denied:['你目前无法办理这项操作','可以返回查看已有事项。','返回']};const content=document.querySelector('#content');function render(){const key=document.querySelector('#state').value,[title,text,action]=cards[key];content.innerHTML=`<article class="card ${key==='success'?'success':''}"><h2>${title}</h2><p>${text}</p>${action?`<button class="primary">${action}</button>`:''}${key==='confirm'?'<details><summary>查看依据</summary><p>你提供的聊天截图</p></details>':''}</article>`;content.querySelector('button')?.addEventListener('click',()=>{document.querySelector('#state').value=key==='confirm'?'success':key==='failure'?'confirm':'input';render()})}document.querySelector('#state').onchange=render;document.querySelector('form').onsubmit=e=>{e.preventDefault();document.querySelector('#state').value='input';render()};render();</script></html>
