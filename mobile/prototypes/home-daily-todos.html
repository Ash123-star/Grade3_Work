<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页 · 每日事项交互原型</title>
<style>
:root{--ink:#263238;--muted:#5b6d65;--green:#257d68;--mint:#e5f5ed;--line:#dce6e1;--paper:#fffdf8;--blue:#e9f2fc;--apricot:#fff3df;--error:#a33636;font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:#e9eeeb}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit;min-height:48px;border-radius:12px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #257d68;outline-offset:2px}button:hover{filter:brightness(.96)}button:disabled{cursor:default;opacity:.55}h1,h2,h3,p{margin:0}h1{font-size:1.65rem;letter-spacing:.05em}h2{font-size:1.14rem}h3{font-size:1rem}.muted{color:var(--muted)}.phone{max-width:440px;margin:auto;background:var(--paper);min-height:100vh;position:relative;box-shadow:0 12px 70px #28433818}.demo{background:#ecf1ef;color:#526359;padding:8px 16px;font-size:.8rem}.demo summary{cursor:pointer;min-height:24px;display:list-item}.tools{padding-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tools select{max-width:100%;padding:10px;border:1px solid var(--line);background:white;border-radius:8px}.tools button{background:white;padding:0 12px}.tools label{display:flex;align-items:center;gap:6px;min-height:48px}.top{padding:22px 16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:.85rem;color:var(--muted);margin-bottom:6px}.message{background:var(--mint);padding:0 13px;color:var(--green);white-space:nowrap}.message b{display:inline-grid;place-items:center;background:white;width:22px;height:22px;border-radius:50%;margin-left:5px}main{padding:0 16px 24px}.summaries{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}.summary{border-radius:20px;padding:14px 12px 0;border:1px solid #d6e5ed;background:linear-gradient(145deg,#f1f7fd,var(--blue));min-width:0}.summary.tasks{background:linear-gradient(145deg,#fff9ee,var(--apricot));border-color:#eee2c8}.summary header{display:flex;align-items:center;gap:6px;margin-bottom:8px}.summary header img{width:30px;height:30px;object-fit:contain}.preview{font-size:.92rem;line-height:1.55;min-height:48px;display:flex;align-items:center;overflow-wrap:anywhere}.preview+.preview{border-top:1px solid #2632380d}.more{width:100%;display:flex;align-items:center;justify-content:space-between;color:var(--green);font-size:.86rem;padding:0}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.section-title p{font-size:.82rem;margin-top:5px}.primary{background:var(--green);color:white;padding:0 16px;font-weight:600;white-space:nowrap}.calendar{background:white;border:1px solid var(--line);border-radius:20px;padding:10px 10px 14px;box-shadow:0 4px 14px #28433805}.monthbar{display:flex;align-items:center;gap:4px;margin-bottom:8px}.monthbar .arrow{width:48px;flex-shrink:0;font-size:1.5rem}.monthbar strong{flex:1;text-align:center;white-space:nowrap;font-size:1.06rem}.monthbar .today{padding:0 10px;color:var(--green);background:#f0f7f3}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}.weekdays span{text-align:center;padding:8px 0;color:var(--muted);font-size:.8rem}.day{min-height:54px;padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.2;min-width:0}.day .count{font-size:.65rem;color:var(--green);min-height:12px;white-space:nowrap}.day.outside{color:#89938d}.day.todaymark .num{font-weight:800;text-decoration:underline;text-underline-offset:4px}.day.selected{background:var(--green);color:white}.day.selected .count{color:white}.day:not(.selected):hover{background:#edf7f0}.calendar-foot{padding:12px 4px 0;border-top:1px solid #eff2f0;margin-top:8px;font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.date-picker{border:0;background:transparent;color:var(--green);min-height:24px;padding:0;max-width:118px;font-size:.75rem}.agenda{margin-top:20px}.agenda-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.agenda-head small{color:var(--muted);font-size:.8rem}.todo-row{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:16px;background:white;padding:6px;margin-bottom:10px}.check{min-width:48px;min-height:48px;display:grid;place-items:center}.check span{width:22px;height:22px;border:1.5px solid #8aa99b;border-radius:7px;display:grid;place-items:center}.done .check span{background:#e5f5ed;border-color:#b9d5c7;color:var(--green)}.todo-text{flex:1;min-width:0;padding:6px 2px;text-align:left;overflow-wrap:anywhere}.todo-text strong{display:block;font-weight:500;font-size:.96rem;line-height:1.5}.todo-text small{display:block;color:var(--muted);font-size:.78rem;margin-top:3px;line-height:1.5}.done .todo-text strong{text-decoration:line-through;color:var(--muted)}.edit{width:48px;flex-shrink:0;color:var(--muted);font-size:1.25rem}.group-caption{color:var(--muted);font-size:.8rem;margin:16px 2px 8px}.empty{padding:26px 12px;text-align:center;background:#f6f8f4;border:1px dashed #ceded3;border-radius:16px;line-height:1.8}.empty button{margin-top:8px;color:var(--green);font-weight:600}.error{color:var(--error);background:#fff1ef}.skel{background:linear-gradient(90deg,#f0f4f1,#e7eee8,#f0f4f1);height:54px;border-radius:12px;margin-bottom:12px}.dispatch-space{height:74px;position:relative;margin-top:12px}.dispatch{position:absolute;right:0;bottom:4px;display:flex;gap:9px;align-items:center;background:var(--mint);border-radius:32px;padding:5px 5px 5px 14px;color:var(--green);font-size:.84rem}.dispatch b{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--green);color:white;font-size:1.8rem;font-weight:400}.bottom{position:sticky;bottom:0;background:#f8fbf5f5;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 8px max(10px,env(safe-area-inset-bottom));z-index:2}.nav{min-height:62px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:center;color:var(--muted);padding:2px}.nav img{width:26px;height:26px;object-fit:contain}.nav.active{color:var(--green);font-weight:bold;background:#e4f3e9;border-radius:18px}.nav span{white-space:nowrap}dialog{border:1px solid var(--line);border-radius:22px;background:var(--paper);color:var(--ink);padding:22px;width:calc(100% - 32px);max-width:410px;max-height:88vh;box-shadow:0 12px 60px #123b2d30}dialog::backdrop{background:#19392e66}dialog h2{margin-bottom:18px}label.field{display:block;margin-bottom:14px;font-size:.9rem}input,textarea{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #cbdad1;border-radius:12px;background:white;color:var(--ink)}textarea{min-height:92px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}.dialog-actions button{padding:0 14px}.danger{color:var(--error);margin-right:auto}.form-error{font-size:.85rem;color:var(--error);line-height:1.5}.sample-list{padding:0;list-style:none}.sample-list li{padding:14px 0;border-bottom:1px solid var(--line);line-height:1.7}.sample-list small{display:block;color:var(--muted)}.large{font-size:21px}.large .summaries{grid-template-columns:1fr}.large .monthbar{flex-wrap:wrap}.large .monthbar strong{font-size:.9rem}.large .calendar{padding:6px}.large .day{min-height:68px}.large .day .count{font-size:.5rem}.large .nav{font-size:.62rem}.large .calendar-foot{flex-wrap:wrap}.large .top{align-items:flex-start;flex-wrap:wrap}.large .section-title{flex-wrap:wrap} [hidden]{display:none!important}
@media(max-width:340px){.summaries{grid-template-columns:1fr}.summary{padding-left:16px;padding-right:16px}.calendar{padding:6px}.monthbar{gap:0}.monthbar strong{font-size:.96rem}.monthbar .today{padding:0 8px}.message{padding:0 10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body><div class="phone">
<details class="demo"><summary>交互原型 · 演示数据，未连接服务</summary><div class="tools"><label>事项状态 <select id="state"><option value="normal">正常</option><option value="empty">空数据</option><option value="error">加载失败</option><option value="loading">加载中</option><option value="conflict">保存冲突</option></select></label><button id="scale">大字体</button><label><input id="manager" type="checkbox" checked style="width:auto;margin:0">有派发资格</label></div></details>
<header class="top"><div><p class="eyebrow">11月4日 · 星期三</p><h1>你好，林小满</h1></div><button class="message" id="message">消息 <b>2</b></button></header>
<main>
<div class="summaries"><section class="summary"><header><img src="../assets/generated_ui/icons/mindmap.png" alt=""><h2>事件纪</h2></header><p class="preview">秋季产品体验升级计划</p><p class="preview">本周五产品评审</p><button class="more" id="events">查看全部 <span>↗</span></button></section><section class="summary tasks"><header><img src="../assets/generated_ui/icons/task.png" alt=""><h2>任务看板</h2></header><p class="preview">完成工作台交互稿</p><p class="preview">确认本周开发安排</p><button class="more" id="tasks">查看全部 <span>↗</span></button></section></div>
<section aria-labelledby="daily-title"><div class="section-title"><div><h2 id="daily-title">每日事项</h2><p class="muted">安排自己的每一天 · 仅自己可见</p></div><button class="primary" id="add">＋ 事项</button></div>
<div id="calendar-panel" class="calendar"><div class="monthbar"><button class="arrow" id="prev" aria-label="上个月">‹</button><strong id="month"></strong><button class="arrow" id="next" aria-label="下个月">›</button><button class="today" id="today">今天</button></div><div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="grid" id="grid" aria-label="每日事项月历"></div><div class="calendar-foot"><span>下划线为今天 · 数字为未完成事项</span><input class="date-picker" id="pick-date" type="date" min="1900-01-01" max="2100-12-31" aria-label="选择日期"></div></div>
<div class="agenda" aria-live="polite"><div class="agenda-head"><h3 id="day-heading"></h3><small id="day-count"></small></div><div id="agenda"></div></div>
</section><div id="dispatch-space" class="dispatch-space"><button class="dispatch" id="dispatch" aria-label="派发任务"><span>派发任务</span><b aria-hidden="true">＋</b></button></div>
</main><nav class="bottom" aria-label="主导航"><button class="nav active" aria-current="page"><img src="../assets/generated_ui/icons/mindmap.png" alt=""><span>首页</span></button><button class="nav" data-tab="公司"><img src="../assets/generated_ui/icons/calendar.png" alt=""><span>公司</span></button><button class="nav" data-tab="日志"><img src="../assets/generated_ui/icons/log.png" alt=""><span>日志</span></button><button class="nav" data-tab="AI地图"><img src="../assets/generated_ui/icons/ai.png" alt=""><span>AI地图</span></button><button class="nav" data-tab="我的"><img src="../assets/generated_ui/icons/members.png" alt=""><span>我的</span></button></nav>
</div>
<dialog id="editor" aria-labelledby="editor-title"><form id="todo-form"><h2 id="editor-title">新增事项</h2><label class="field">事项标题<input id="title" maxlength="120" required placeholder="想做的事，记在这里" autocomplete="off"></label><label class="field">日期<input type="date" id="date" min="1900-01-01" max="2100-12-31" required></label><label class="field">备注（选填）<textarea id="note" maxlength="2000" placeholder="补充一点细节"></textarea></label><p id="form-error" class="form-error" role="alert"></p><div class="dialog-actions"><button id="remove" type="button" class="danger">删除</button><button id="cancel" type="button">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
<dialog id="info" aria-labelledby="info-title"><h2 id="info-title"></h2><div id="info-content"></div><div class="dialog-actions"><button id="close-info" class="primary">知道了</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), today='2026-11-04';
let selected=today,month=10,year=2026,editing=null,nextId=8;
let todos=[{id:1,date:today,title:'读完《设计心理学》这一章',note:'留一点时间给自己的成长',done:false},{id:2,date:today,title:'下班后散步半小时',note:'走一条平时没走过的路',done:false},{id:3,date:today,title:'预约周末的牙齿检查',note:'',done:true},{id:4,date:'2026-11-06',title:'整理照片',note:'',done:false},{id:5,date:'2026-11-12',title:'给绿植浇水',note:'',done:false},{id:6,date:'2026-11-18',title:'读书',note:'',done:true},{id:7,date:'2026-11-26',title:'整理个人账单',note:'',done:false}];
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const list=date=>$('state').value==='empty'?[]:todos.filter(t=>t.date===date);
function choose(date){selected=date;let d=parse(date);year=d.getFullYear();month=d.getMonth();render()}
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function render(){
 $('month').textContent=`${year}年 ${month+1}月`;$('pick-date').value=selected;$('grid').replaceChildren();
 const unavailable=['error','loading'].includes($('state').value);$('calendar-panel').hidden=unavailable;
 $('prev').disabled=year===1900&&month===0;$('next').disabled=year===2100&&month===11;
 const first=new Date(year,month,1),start=new Date(year,month,1-(first.getDay()+6)%7),cells=Math.ceil(((first.getDay()+6)%7+new Date(year,month+1,0).getDate())/7)*7;
 for(let i=0;i<cells;i++){const d=new Date(start);d.setDate(start.getDate()+i);const date=key(d),items=list(date),pending=items.filter(t=>!t.done).length;
 const b=el('button',undefined,`day${d.getMonth()!==month?' outside':''}${date===selected?' selected':''}${date===today?' todaymark':''}`);
 b.setAttribute('aria-pressed',String(date===selected));b.setAttribute('aria-label',`${date}${date===today?' 今天':''}，${pending}项未完成，${items.length-pending}项已完成`);b.disabled=d.getFullYear()<1900||d.getFullYear()>2100;
 b.append(el('span',String(d.getDate()),'num'),el('span',pending?String(pending):items.length?'✓':'','count'));b.onclick=()=>choose(date);$('grid').append(b)}
 const day=parse(selected);$('day-heading').textContent=`${day.getMonth()+1}月${day.getDate()}日${selected===today?' · 今天':''}`;
 const items=list(selected);$('day-count').textContent=unavailable?'':`${items.filter(t=>!t.done).length}件待办 / ${items.length}件事项`;$('agenda').replaceChildren();
 if($('state').value==='loading'){for(let i=0;i<3;i++)$('agenda').append(el('div',undefined,'skel'));$('agenda').append(el('p','正在加载每日事项…','muted'));return}
 if($('state').value==='error'){const box=el('div',undefined,'empty error');box.append(el('p','每日事项暂时加载失败'));const retry=el('button','重试');retry.onclick=()=>{$('state').value='normal';render()};box.append(retry);$('agenda').append(box);return}
 if(!items.length){const box=el('div',undefined,'empty');box.append(el('p','这一天，留给想做的事。'));const add=el('button','＋ 添加一件小事');add.onclick=()=>openEditor();box.append(add);$('agenda').append(box);return}
 for(const done of [false,true]){const group=items.filter(t=>t.done===done);if(done&&group.length)$('agenda').append(el('p',`已完成 · ${group.length}`,'group-caption'));for(const t of group){const row=el('div',undefined,'todo-row'+(t.done?' done':''));const toggle=el('button',undefined,'check');toggle.setAttribute('aria-label',`${t.done?'恢复未完成':'标记完成'}：${t.title}`);toggle.setAttribute('aria-pressed',String(t.done));toggle.append(el('span',t.done?'✓':''));toggle.onclick=()=>{if($('state').value==='conflict'){openEditor(t);$('form-error').textContent='这条事项已有新版本，请刷新后重新确认。';return}t.done=!t.done;render()};const content=el('button',undefined,'todo-text');content.append(el('strong',t.title));if(t.note)content.append(el('small',t.note));content.onclick=()=>openEditor(t);const edit=el('button','⋯','edit');edit.setAttribute('aria-label',`编辑或删除：${t.title}`);edit.onclick=()=>openEditor(t);row.append(toggle,content,edit);$('agenda').append(row)}}
}
function openEditor(t=null){editing=t?.id??null;$('editor-title').textContent=t?'编辑事项':'新增事项';$('title').value=t?.title??'';$('date').value=t?.date??selected;$('note').value=t?.note??'';$('remove').hidden=!t;$('form-error').textContent='';$('editor').showModal()}
function info(title,content){$('info-title').textContent=title;$('info-content').replaceChildren(typeof content==='string'?el('p',content):content);$('info').showModal()}
$('add').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();$('close-info').onclick=()=>$('info').close();
$('todo-form').onsubmit=e=>{e.preventDefault();if(!$('title').value.trim()){$('form-error').textContent='请填写事项标题。';return}if($('state').value==='conflict'){$('form-error').textContent='保存冲突：服务端已有新版本。输入已保留，请刷新后重新确认。（演示）';return}if(['error','loading'].includes($('state').value)){$('form-error').textContent='当前无法保存，输入已保留，请稍后重试。（演示）';return}const t=editing?todos.find(t=>t.id===editing):{id:nextId++,done:false};t.title=$('title').value.trim();t.date=$('date').value;t.note=$('note').value.trim();if(!editing)todos.push(t);$('state').value='normal';$('editor').close();choose(t.date)};
$('remove').onclick=()=>{if(!window.confirm('删除这条个人事项？'))return;if($('state').value==='conflict'){$('form-error').textContent='版本已变化，删除未执行，请刷新后确认。（演示）';return}todos=todos.filter(t=>t.id!==editing);$('editor').close();render()};
$('prev').onclick=()=>choose(key(new Date(year,month-1,1)));$('next').onclick=()=>choose(key(new Date(year,month+1,1)));$('today').onclick=()=>choose(today);$('pick-date').onchange=()=>{if($('pick-date').checkValidity()&&$('pick-date').value)choose($('pick-date').value)};
$('state').onchange=render;$('scale').onclick=()=>{document.documentElement.classList.toggle('large');$('scale').textContent=document.documentElement.classList.contains('large')?'标准字体':'大字体'};$('manager').onchange=()=>$('dispatch-space').hidden=!$('manager').checked;
$('events').onclick=()=>{const ul=el('ul',undefined,'sample-list');for(const t of ['秋季产品体验升级计划','本周五产品评审','跨部门协作约定'])ul.append(el('li',t));info('事件纪 · 演示',ul)};
$('tasks').onclick=()=>{const ul=el('ul',undefined,'sample-list');for(let i=1;i<=12;i++){const li=el('li',i===1?'完成工作台交互稿':i===2?'确认本周开发安排':`项目协作事项 ${i}`);li.append(el('small','参与人：林小满、陈晨 · 演示记录'));ul.append(li)}info('任务看板 · 12项演示记录',ul)};
$('dispatch').onclick=()=>info('派发任务','正式实现将打开现有派发表单。本入口与私人事项分开；此原型不发送任务。');$('message').onclick=()=>info('消息','这里将进入现有消息中心。此原型仅演示首页布局。');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>info(b.dataset.tab,b.dataset.tab==='公司'?'原“视图”页面更名为“公司”，继续使用现有公司任务日历。':'继续使用现有页面。此原型只演示首页与每日事项。'));
render();
</script></body></html>
