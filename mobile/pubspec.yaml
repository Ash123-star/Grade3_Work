name: pandora_mobile
description: Pandora enterprise collaboration Android UI shell.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.8.0
  shared_preferences: ^2.5.3
  file_picker: ^10.3.0
  cute_ui:
    path: packages/cute_ui
  drift: ^2.35.2
  sqlite3: 3.5.1
  cryptography: ^2.9.0
  flutter_secure_storage: 10.0.0
  path_provider: ^2.1.6
  path: ^1.9.1
  forui: 0.17.0
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/phosphor/
    - assets/companions/
    - assets/licenses/
