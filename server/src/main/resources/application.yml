server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/workpanel}
    username: ${DB_USER:workpanel}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:56379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    async:
      request-timeout: 60000
app:
  push:
    enabled: ${PUSH_ENABLED:false}
    app-key: ${PUSH_APP_KEY:0}
    access-key-id: ${PUSH_ACCESS_KEY_ID:}
    access-key-secret: ${PUSH_ACCESS_KEY_SECRET:}
    security-token: ${PUSH_SECURITY_TOKEN:}
    huawei-channel: ${PUSH_HUAWEI_CHANNEL:}
    xiaomi-channel: ${PUSH_XIAOMI_CHANNEL:}
    oppo-category: ${PUSH_OPPO_CATEGORY:}
    vivo-channel: ${PUSH_VIVO_CHANNEL:}
    honor-channel: ${PUSH_HONOR_CHANNEL:}
  oss:
    bucket: ${OSS_BUCKET:panduola-work}
    region: ${OSS_REGION:cn-beijing}
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    prefix: ${OSS_PREFIX:workpanel}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    security-token: ${OSS_SECURITY_TOKEN:}
    role-name: ${OSS_ROLE_NAME:}
  generated-file-hours: ${GENERATED_FILE_HOURS:24}
  admin-account: ${ADMIN_ACCOUNT:}
  admin-password: ${ADMIN_PASSWORD:}
  admin-phone: ${ADMIN_PHONE:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  session-hours: ${SESSION_HOURS:168}
  scenario-data-enabled: ${SCENARIO_DATA_ENABLED:false}
  scenario-password: ${SCENARIO_PASSWORD:}
  scenario-dataset: ${SCENARIO_DATASET:legacy}
  jobs-enabled: ${JOBS_ENABLED:true}
  deepseek-key: ${DEEPSEEK_API_KEY:}
  deepseek-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  deepseek-model: ${DEEPSEEK_MODEL:deepseek-chat}
  ai-daily-tokens: ${AI_DAILY_TOKENS:50000}
  ai-max-tokens: ${AI_MAX_TOKENS:2000}
  ai-timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  neo4j-uri: ${NEO4J_URI:}
  neo4j-username: ${NEO4J_USERNAME:neo4j}
  neo4j-password: ${NEO4J_PASSWORD:}
  memory-extract-enabled: ${AI_MEMORY_EXTRACT_ENABLED:true}
  ai-workbench-enabled: ${AI_WORKBENCH_ENABLED:true}
  ai-work-execution-enabled: ${AI_WORK_EXECUTION_ENABLED:false}
  ai-ocr-enabled: ${AI_OCR_ENABLED:false}
  ai-ocr-url: ${AI_OCR_URL:}
  ai-parser-sandbox: ${AI_PARSER_SANDBOX:/usr/local/bin/workpanel-parser-sandbox}
  ai-parser-sandbox-required: ${AI_PARSER_SANDBOX_REQUIRED:false}
springdoc:
  remove-broken-reference-definitions: false
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs

# 全部审核消费者兼容 MOVE 候选后才在部署配置中启用。
workpanel:
  calendar:
    move-enabled: ${CALENDAR_MOVE_ENABLED:false}
logging:
  level:
    com.aliyun.oss: "OFF"
